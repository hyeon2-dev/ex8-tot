# 워크플로우(작업) 이름
name: GitOps DOCKER CICD Pipeline
# 1. 트리거 설정: 브랜치 정의
on:
  push:
    branches: ["main"]  # <- 하나만 있을때
      # - main

jobs:
  build-and-update:
    runs-on: ubuntu-latest  # 실제 작업 주체

    steps:
    - name: 소스코드 전송
      uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{secrets.DOCKER_USER}}
        password: ${{secrets.DOCKER_PASSWORD}}


    - name: AWS 자격 증명 설정
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{secrets.AWS_ACCESS_KEY}}
        aws-secret-access-key: ${{secrets.AWS_SECRET_ACCESS_KEY}}
        aws-region: ${{secrets.AWS_REGION}}

    # ECR에 Docker 이미지 빌드 및 푸시
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
            
    - name: S3 정적웹사이트로 docker-compose.yaml 배포
      run: |
        # 전체 동기화 / 하나만 동기화하고 싶으면 cp
        aws s3 cp ./docker-compose.yaml s3://std19-website0914-bucket/docker-compose.yaml
        aws s3 sync ./nginx/html/ s3://std19-website0914-bucket/html/ --delete
        aws s3 sync ./fastapi/app/ s3://std19-website0914-bucket/app/ --delete

    - name: Build and push Docker image to ECR
      # env:
      #   ECR_REGISTRY: ${{}}
      #   ECR_REPOSITORY: ${{}}
      #   IMAGE_TAG: ${{github.sha}}
      run: |
        docker build --no-cache -t 925047940866.dkr.ecr.us-west-2.amazonaws.com/std19-nginx:1.31.3-ecr ./nginx
        docker build --no-cache -t 925047940866.dkr.ecr.us-west-2.amazonaws.com/std19-nginx:latest ./nginx
        docker build --no-cache -t 925047940866.dkr.ecr.us-west-2.amazonaws.com/std19-fastapi:v1 ./fastapi
        docker build --no-cache -t 925047940866.dkr.ecr.us-west-2.amazonaws.com/std19-fastapi:latest ./fastapi

        docker push 925047940866.dkr.ecr.us-west-2.amazonaws.com/std19-nginx:1.31.3-ecr
        docker push 925047940866.dkr.ecr.us-west-2.amazonaws.com/std19-nginx:latest
        docker push 925047940866.dkr.ecr.us-west-2.amazonaws.com/std19-fastapi:v1
        docker push 925047940866.dkr.ecr.us-west-2.amazonaws.com/std19-fastapi:latest
      
    - name: 컨테이너 배포 및 S3 파일 싱크
      run: |
        # 소스 데이터 S3 버킷으로 업로드
        aws ssm send-command \
          --document-name "AWS-RunShellScript" \
          --targets "Key=tag:Cicd,Values=asg" \
          --parameters "commands=[
            \"sudo aws ecr get-login-password --region us-west-2 | sudo docker login --username AWS --password-stdin 925047940866.dkr.ecr.us-west-2.amazonaws.com\",
            \"sudo docker stop nginx-container fastapi-container|| true\",
            \"sudo docker rm nginx-container fastapi-container|| true\",
            \"sudo mkdir -p /home/ec2-user/nginx/\",
            \"sudo mkdir -p /home/ec2-user/fastapi/app\",
            \"sudo chown -R ec2-user:ec2-user /home/ec2-user/nginx/\",
            \"sudo chown -R ec2-user:ec2-user /home/ec2-user/fastapi/\",
            \"sudo aws s3 sync s3://std19-website0914-bucket/html/ /home/ec2-user/nginx/html/\",
            \"sudo aws s3 sync s3://std19-website0914-bucket/app/ /home/ec2-user/fastapi/app/\",
            \"sudo aws s3 cp s3://std19-website0914-bucket/docker-compose.yaml /home/ec2-user/docker-compose.yaml\",
            \"cd /home/ec2-user\",
            \"sudo docker compose pull\",
            \"sudo docker compose up -d --remove-orphans\",
            \"sudo docker image prune -f\"
          ]" \
          --region ${{secrets.AWS_REGION}} \
          --comment "Deploying SSM docker"
