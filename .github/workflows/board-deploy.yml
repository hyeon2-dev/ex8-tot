name: Board ECR GitOps Pipeline

on:
  push:
    branches: ["main"]
    paths:
      - "app/board/**"
      - ".github/workflows/board-deploy.yaml"

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 소스코드 가져오기
        uses: actions/checkout@v4

      - name: AWS 자격 증명 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Amazon ECR 로그인
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 프론트엔드 이미지 빌드 및 ECR 업로드
        uses: docker/build-push-action@v5
        with:
          context: ./app/board/frontend
          file: ./app/board/frontend/Dockerfile
          push: true
          tags: 925047940866.dkr.ecr.us-west-2.amazonaws.com/std19-ex8-nginx:${{ github.sha }}

      - name: 백엔드 이미지 빌드 및 ECR 업로드
        uses: docker/build-push-action@v5
        with:
          context: ./app/board/backend
          file: ./app/board/backend/Dockerfile
          push: true
          tags: 925047940866.dkr.ecr.us-west-2.amazonaws.com/std19-ex8-fastapi:${{ github.sha }}

      - name: 배포파일의 이미지 주소 변경
        run: |
          sed -i \
            "s|image: .*|image: 925047940866.dkr.ecr.us-west-2.amazonaws.com/std19-ex8-nginx:${{ github.sha }}|g" \
            k8s/frontend.yaml

          sed -i \
            "s|image: .*|image: 925047940866.dkr.ecr.us-west-2.amazonaws.com/std19-ex8-fastapi:${{ github.sha }}|g" \
            k8s/backend.yaml

      - name: 변경한 이미지 설정을 Git에 저장
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add k8s/frontend.yaml k8s/backend.yaml

          git commit -m "Deployment file tag Update(${{ github.sha }})"
          git push