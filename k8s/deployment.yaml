apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  namespace: default
spec:
  replicas: 2   # 파드 갯수
  selector:
    matchLabels:
      app: nginx-web-label    # Deployment가 관리할 파드명
  template:
    metadata:
      labels:
        app: nginx-web-label
    spec:
      containers:
        - name: nginx-container
          image: hyeon22/nginx:b93723e18073b840f2b4e4d9b8622be1980505a8
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-svc
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: nginx-web-label
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: alb-base-ingress
  annotations:  # 보안 그룹 등 AWS에 대한 설정들
    # 보안 그룹 설정: alb.ingress.kubernetes.io/security-groups: id, id, ...
    # alb.ingress.kubernetes.io/security-groups: sg-08344a6a23c701510
    # internet-facing: 외부로드밸런서(IP 부여), internet(내부)
    alb.ingress.kubernetes.io/scheme: internet-facing
    # ip(Pod의 IP로 트래픽 전달)
    # instance: EC2인스턴스를 대상으로 하는 타겟 그룹 생성
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    # HTTPS 인증서 정의: alb.ingress.kubernetes.io/certificate-arn: <인증서ARN>
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-west-2:925047940866:certificate/2c1052cf-c683-464d-a305-8098754408c8
    # HTTP접속 시 HTTPS로 리다이렉션(선택사항, 권장)
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    # 경로 재작성: 백앤드로 연결시 경로를 바꿔줍니다.
    # Nginx Ingress Controller 사용시: nginx.ingress.kubernetes.io/rewrite-target: /
    # alb.ingress.kubernetes.io/transforms.<service-name>: >
    alb.ingress.kubernetes.io/transforms.nginx-svc: >
      [
        {
          "type": "url-rewrite",
          "urlRewriteConfig": {
            "rewrites": [
              {
                "regex": "^\\/nginx(?:\\/(.*))?$",
                "replace": "/$1"
              }
            ]
          }
        }
      ]
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx-svc   # Kubernetes Service Name
                port:
                  number: 80
          # - path: /api      # fastAPI: main.py의 # app = FastAPI(root_path="/api")
          #   pathType: Prefix
          #   backend:
          #     service:
          #       name: <service_name>
          #       port:
          #         number: 8000
